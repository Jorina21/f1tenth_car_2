f1tenth_race_day:
  ros__parameters:

    # -------------------------------------------------------------------------
    # ROS topics / pose source
    # -------------------------------------------------------------------------

    scan_topic: "/scan"              # LiDAR topic. Usually /scan. Range: stack-specific.
    odom_topic: "/odom"              # Odometry topic. Usually /odom. Range: stack-specific.
    pose_topic: "/amcl_pose"         # Localized pose topic. Usually /amcl_pose. Range: stack-specific.

    use_amcl_pose: true              # true = use AMCL pose, false = use odom.
                                      # Recommended: true for mapped racing. false only for short odom tests.

    drive_topic: "/drive"            # Output Ackermann command topic.
                                      # Common values: /drive, /ackermann_cmd, /safety/drive.

    waypoint_file: "/home/arc/f1tenth_ws/waypoints/enriched_waypoints/ld_3rd_waypoints_enriched.csv"
                                      # Raceline CSV path.
                                      # Expected columns: x,y and optionally yaw, curvature, speed.
                                      # Range: valid absolute file path.

    wheelbase: 0.254                 # Vehicle wheelbase in meters.
                                      # Standard F1TENTH range: 0.25 - 0.33.
                                      # Do not tune unless physical wheelbase is different.

    # -------------------------------------------------------------------------
    # Master switches
    # -------------------------------------------------------------------------

    enable_frenet_planner: true       # Enables left/right offset planner for passing obstacles.
                                      # true = obstacle passing enabled.
                                      # false = pure pursuit raceline only.

    enable_guardian: false            # Enables raw LiDAR safety override.
                                      # false = easier planner debugging.
                                      # true = safer real testing once sectors/distances are tuned.

    enable_recovery: false            # Enables reverse/realign recovery behavior.
                                      # false while testing normal driving.
                                      # true after pure pursuit + passing are stable.

    enable_emergency_stop_latch: false
                                      # true = emergency stop stays stopped until node restart.
                                      # false = can resume if danger clears.
                                      # Use true for conservative race safety.

    debug_prints: true                # Prints state, speed, steering, offset, pass target.
                                      # true while tuning. false for cleaner race terminal.

    debug_lidar: false                # Prints LiDAR sector distances.
                                      # true when debugging obstacle/guardian detection.
                                      # false for normal driving.

    # -------------------------------------------------------------------------
    # Speed
    # -------------------------------------------------------------------------

    max_speed: 2.0                    # Maximum commanded speed in m/s.
                                      # Safe test range: 0.4 - 1.2.
                                      # Race range: 1.5 - 3.0 depending on track.
                                      # Increase only after clean laps.

    min_speed: 1.0                   # Minimum normal forward speed in m/s.
                                      # Range: 0.25 - 1.0.
                                      # Lower if it creeps into obstacles.
                                      # Higher if car stalls or is too slow.

    recovery_speed: 0.35              # Slow forward speed used in recovery.
                                      # Range: 0.2 - 0.6.
                                      # Keep low; recovery is not racing.

    reverse_speed: -0.30              # Reverse speed in recovery.
                                      # Range: -0.2 to -0.6.
                                      # More negative = faster reverse.
                                      # Keep gentle without rear LiDAR.

    accel_limit: 0.8                  # Max speed increase per second.
                                      # Safe range: 0.4 - 1.5.
                                      # Aggressive range: 1.5 - 3.0.
                                      # Lower = smoother acceleration.

    decel_limit: 2.5                  # Max speed decrease per second.
                                      # Range: 1.5 - 5.0.
                                      # Increase if it brakes too late.
                                      # Decrease if speed commands are too jerky.

    # -------------------------------------------------------------------------
    # Pure pursuit lookahead
    # -------------------------------------------------------------------------

    lookahead_min: 0.40               # Minimum lookahead distance in meters.
                                      # Range: 0.30 - 0.80.
                                      # Decrease for sharper obstacle avoidance.
                                      # Increase if oscillating.

    lookahead_max: 2.50               # Maximum lookahead distance in meters.
                                      # Range: 0.70 - 2.50.
                                      # Lower for tight hallway passing.
                                      # Higher for high-speed straights.

    lookahead_gain: 0.18              # Speed-based lookahead gain.
                                      # Range: 0.10 - 0.60.
                                      # Higher = smoother at speed.
                                      # Lower = more responsive but twitchier.

    # -------------------------------------------------------------------------
    # Steering
    # -------------------------------------------------------------------------

    steering_limit: 0.42              # Maximum steering angle in radians.
                                      # Range: 0.30 - 0.50.
                                      # Use physical steering limit of car.
                                      # Too low = cannot clear obstacles.

    steering_rate_limit: 3.0          # Maximum steering change rate in rad/s.
                                      # Range: 1.0 - 4.0.
                                      # Increase if it turns too slowly.
                                      # Decrease if steering is twitchy.

    steering_smoothing_alpha: 0.60    # Steering smoothing filter.
                                      # Range: 0.20 - 0.75.
                                      # Lower = faster response.
                                      # Higher = smoother but slower.
                                      # If it only moves 4 inches, lower this.

    steering_slowdown_gain: 2.0       # Slows car when steering angle is large.
                                      # Range: 0.5 - 4.0.
                                      # Increase if it enters turns too fast.
                                      # Decrease if it slows too much in turns.

    max_lateral_accel: 2.0            # Curvature-based speed limit in m/s^2.
                                      # Safe range: 1.0 - 2.5.
                                      # Aggressive range: 2.5 - 4.5.
                                      # Higher = faster turns, more slide risk.

    # -------------------------------------------------------------------------
    # Frenet local planner
    # -------------------------------------------------------------------------

    frenet_max_offset: 0.55           # Max left/right offset from raceline in meters.
                                      # Narrow hallway range: 0.25 - 0.45.
                                      # Wider track range: 0.45 - 0.80.
                                      # Increase if it does not clear suitcase/cone.
                                      # Decrease if too close to walls.

    frenet_num_offsets: 5             # Number of lateral offset paths sampled.
                                      # Common values: 3, 5, 7.
                                      # 3 = left/center/right.
                                      # 5 = better pass choices.
                                      # 7 = smoother choices, more compute/noise.

    frenet_horizon: 3.0               # Distance ahead to evaluate offset paths in meters.
                                      # Range: 1.5 - 5.0.
                                      # Increase for faster racing.
                                      # Decrease in tight/narrow areas.

    frenet_step: 0.20                 # Intended path sample spacing in meters.
                                      # Range: 0.05 - 0.25.
                                      # Smaller = denser collision checking if fully used.
                                      # Larger = faster but less precise.

    path_corridor_width: 0.35         # Corridor width around path used to declare blocked.
                                      # Range: 0.20 - 0.60.
                                      # Increase if it misses cones/suitcase.
                                      # Decrease if it thinks everything is blocked.

    offset_change_rate: 0.8          # How fast target offset moves sideways in m/s.
                                      # Range: 0.30 - 1.30.
                                      # Increase if it barely moves left/right.
                                      # Decrease if it swerves too hard.

    # -------------------------------------------------------------------------
    # Opponent / obstacle behavior
    # -------------------------------------------------------------------------

    opponent_detect_distance: 3.0     # Distance ahead to detect raceline blockage.
                                      # Slow range: 1.5 - 3.0.
                                      # Fast range: 3.0 - 6.0.
                                      # Increase with speed.
                                      # Decrease if reacting to far clutter.

    safe_follow_distance: 0.5         # Distance to keep if no pass is safe.
                                      # Range: 0.5 - 1.5.
                                      # Increase for safety.
                                      # Decrease only for tight racing.

    obstacle_slow_distance: 1.3       # Distance where speed starts reducing.
                                      # Range: 0.8 - 3.0.
                                      # Increase if braking late.
                                      # Decrease if slowing too early.

    obstacle_stop_distance: 0.45      # Distance where speed/guardian commands stop.
                                      # Aggressive range: 0.30 - 0.45.
                                      # Safer range: 0.50 - 0.90.
                                      # Increase if hitting objects.
                                      # Decrease if stopping too far away.

    collision_radius: 0.35            # Minimum clearance from candidate path to obstacle.
                                      # Range: 0.25 - 0.55.
                                      # Increase for safer/wider clearance.
                                      # Decrease if all pass paths are rejected.

    # -------------------------------------------------------------------------
    # LiDAR guardian sectors
    # -------------------------------------------------------------------------

    guardian_front_angle_deg: 18.0    # Half-angle of front danger sector.
                                      # Hallway range: 12 - 20 deg.
                                      # Open track range: 20 - 35 deg.
                                      # Decrease if side walls trigger false stops.
                                      # Increase for wider safety view.

    front_left_min_deg: 15.0          # Front-left sector start angle.
                                      # Range: 10 - 30 deg.
                                      # Used for recovery/gap direction.

    front_left_max_deg: 60.0          # Front-left sector end angle.
                                      # Range: 45 - 80 deg.
                                      # Increase to see more left-side space.

    front_right_min_deg: -60.0        # Front-right sector start angle.
                                      # Range: -80 to -45 deg.
                                      # Used for recovery/gap direction.

    front_right_max_deg: -15.0        # Front-right sector end angle.
                                      # Range: -30 to -10 deg.
                                      # If left/right behavior seems flipped, verify LiDAR angle convention.

    side_wall_angle_min_deg: 60.0     # Side wall sector start angle.
                                      # Range: 50 - 75 deg.
                                      # Lower sees more front-side wall.

    side_wall_angle_max_deg: 110.0    # Side wall sector end angle.
                                      # Range: 95 - 130 deg.
                                      # Higher sees farther behind-side wall.

    wall_min_distance: 0.25           # Minimum safe side wall distance in meters.
                                      # Range: 0.18 - 0.45.
                                      # Increase if scraping walls.
                                      # Decrease if guardian slows constantly in narrow hallway.

    # -------------------------------------------------------------------------
    # Passing behavior / pass latch
    # -------------------------------------------------------------------------

    pass_commit_time: 1.2             # Minimum time to stay in PASS_LEFT/PASS_RIGHT.
                                      # Range: 0.5 - 2.0 sec.
                                      # Increase if it returns before clearing obstacle.
                                      # Decrease if it commits too long to bad pass.

    pass_clear_distance: 1.0          # Distance ahead checked before allowing merge-back.
                                      # Range: 0.5 - 1.5 m.
                                      # Increase if it merges back into suitcase/cone.
                                      # Decrease if it stays offset too long.

    pass_hold_extra_time: 0.8         # Extra time to keep pass lane after obstacle appears clear.
                                      # Range: 0.3 - 1.5 sec.
                                      # Increase if rear/middle clips object.
                                      # Decrease if it stays left/right too long.

    force_full_pass_offset: true      # true = PASS_LEFT/RIGHT uses full +/- frenet_max_offset.
                                      # true is best for cones/suitcases.
                                      # false allows softer offsets but may not clear objects.

    switching_penalty: 5.0            # Cost penalty for changing pass direction.
                                      # Range: 1.0 - 8.0.
                                      # Increase if it switches left/right.
                                      # Decrease if it refuses better open side.

    pass_offset_threshold: 0.08       # Offset needed before state becomes PASS_LEFT/PASS_RIGHT.
                                      # Range: 0.03 - 0.15.
                                      # Increase to ignore tiny offsets.
                                      # Decrease if pass state rarely triggers.

    return_offset_tolerance: 0.05     # Offset close enough to zero to call raceline returned.
                                      # Range: 0.03 - 0.12.
                                      # Increase if stuck in RETURN_TO_RACELINE.
                                      # Decrease for more exact raceline return.

    # -------------------------------------------------------------------------
    # Candidate path cost weights
    # -------------------------------------------------------------------------

    raceline_cost_weight: 0.15        # Penalty for leaving raceline.
                                      # Range: 0.1 - 1.5.
                                      # Lower = more willing to pass.
                                      # Higher = stays closer to raceline.

    collision_cost_weight: 12.0       # Penalty for obstacle risk near candidate path.
                                      # Range: 5.0 - 30.0.
                                      # Increase for safer clearance.
                                      # Decrease if overly cautious.

    smoothness_cost_weight: 0.5       # Penalty for changing offset sharply.
                                      # Range: 0.2 - 5.0.
                                      # Increase for smoother movement.
                                      # Decrease for stronger obstacle dodging.

    progress_reward_weight: 1.0       # Reward for paths clear farther ahead.
                                      # Range: 0.3 - 3.0.
                                      # Increase to prefer open paths.
                                      # Decrease if it over-prioritizes long clear paths.

    pass_reward_weight: 4.0           # Reward for choosing non-center path when blocked.
                                      # Range: 0.5 - 5.0.
                                      # Increase if it refuses to pass.
                                      # Decrease if it passes unnecessarily.

    # -------------------------------------------------------------------------
    # Recovery
    # -------------------------------------------------------------------------

    allow_reverse: true               # Allows reverse if front is blocked in recovery.
                                      # true for recovery testing.
                                      # false if reverse is unsafe or drivetrain behaves badly.

    max_reverse_time: 0.8             # Maximum reverse duration in seconds.
                                      # Range: 0.3 - 1.5.
                                      # Increase if it cannot back out.
                                      # Decrease if it reverses too far.

    stuck_speed_threshold: 0.08       # Speed threshold used for stuck detection.
                                      # Range: 0.05 - 0.20.
                                      # Increase if stuck detection misses.
                                      # Decrease if false stuck triggers.

    stuck_time_threshold: 1.0         # Time before declaring stuck.
                                      # Range: 0.5 - 3.0 sec.
                                      # Increase if false stuck triggers.
                                      # Decrease for faster recovery.

    recovery_heading_tolerance_deg: 35.0
                                      # Heading error allowed before exiting recovery.
                                      # Range: 15 - 60 deg.
                                      # Lower = stricter alignment.
                                      # Higher = easier recovery exit.

    recovery_front_clear_distance: 1.0
                                      # Front clearance needed to creep forward in recovery.
                                      # Range: 0.6 - 1.8.
                                      # Increase for safety.
                                      # Decrease if recovery refuses to move.

    # -------------------------------------------------------------------------
    # Pose validation
    # -------------------------------------------------------------------------

    pose_jump_threshold: 0.75         # Max sudden position jump allowed in meters.
                                      # Range: 0.3 - 1.5.
                                      # Lower catches AMCL jumps sooner.
                                      # Higher avoids false triggers.

    yaw_jump_threshold_deg: 60.0      # Max sudden yaw jump allowed in degrees.
                                      # Range: 30 - 120.
                                      # Lower catches bad localization sooner.
                                      # Higher is less sensitive.

    # -------------------------------------------------------------------------
    # Control loop
    # -------------------------------------------------------------------------

    control_rate_hz: 30.0             # Main control loop rate in Hz.
                                      # Range: 20 - 50 Hz for Python.
                                      # 30 Hz is a good F1TENTH default.