reactive_autonomy:
  ros__parameters:
    scan_topic: /scan
    drive_topic: /ackermann_cmd

    front_fov_deg: 180.0
    range_clip_max: 8.0
    range_clip_min: 0.05
    bubble_radius_m: 0.40
    gap_min_width_deg: 8.0

    steer_limit_rad: 0.40
    steer_smooth_alpha: 0.35

    speed_min: 2.0
    speed_max: 4.0
    speed_turn_scale: 2.2
    speed_dist_gain: 1.1

    ttc_emergency: 0.45
    ttc_slow: 0.90

    jump_drop_m: 0.9
    jump_hold_sec: 0.6
